services:
  - type: web
    name: wheel-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: wheel-db
          property: connectionString
    dependsOn:
      - wheel-db
  - type: pserv
    name: wheel-db
    env: postgresql
    plan: free
