services:
  - type: web
    name: wheel-app
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wheel-db
          property: connectionString
  - type: pserv
    name: wheel-db
    env: postgresql
    plan: free
