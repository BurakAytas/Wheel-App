<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yönetici</title>
  <script defer src="/js/utils.js"></script>
  <script defer src="/admin.js"></script>
  <style>
    :root {
      --bg: radial-gradient(1200px 600px at 50% 10%, #eef3ff, #dde7fb, #cfe0fc);
      --card: #ffffff;
      --border: #e5e7eb;
      --muted: #6b7280;
      --primary: #1f6feb;
      --danger: #dc2626;
      --success: #16a34a;
    }
    body { margin:0; min-height:100vh; font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; background: var(--bg); }

    /* Login Card */
    .login-wrap { display:grid; place-items:center; min-height: 100vh; padding: 24px; }
    .login-card { background: var(--card); width:100%; max-width: 380px; border-radius: 14px; box-shadow: 0 20px 60px rgba(0,0,0,0.18); padding: 22px; }
    .login-card h2 { margin:0 0 10px; font-size: 22px; }
    .login-sub { margin:0 0 18px; color: var(--muted); font-size: 14px; }
    .field { margin-bottom: 12px; }
    .field label { display:block; font-size: 13px; color:#374151; margin-bottom:6px; }
    .field input { 
      width:100%; 
      padding: 10px 12px; 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      font-size:14px; 
      box-sizing: border-box;
      line-height: 1.4;
    }
    .btn { width:100%; padding: 12px; border:none; border-radius: 10px; color:#fff; background: var(--primary); cursor:pointer; font-size:15px; }
    .err { color:#b42318; font-size: 13px; min-height: 18px; margin-top: 6px; }

    /* Panel */
    .panel { display:none; min-height: 100vh; }
    .topbar { display:flex; align-items:center; justify-content: space-between; padding: 14px 18px; background:#0b132a; color:#fff; }
    .topbar h2 { margin:0; font-size: 18px; }
    .topbar .actions { display:flex; gap:10px; }
    .topbar button { padding:8px 12px; border:none; border-radius: 8px; cursor:pointer; color:#fff; }
    .topbar .refresh { background:#2563eb; }
    .topbar .logout { background:#ef4444; }
    .topbar .danger { background:#dc2626; }
    .topbar .settings { background:#10b981; }
    .content { padding: 18px; }
    .alert { display:none; margin: 0 0 12px; padding:10px 12px; border-radius: 8px; background:#fef2f2; color:#991b1b; border:1px solid #fecaca; }
    .table-wrap { background: var(--card); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); overflow:auto; }
    table { width: 100%; border-collapse: collapse; }
    th, td { border-bottom: 1px solid var(--border); padding: 10px 12px; font-size: 14px; text-align: left; }
    th { background:#f8fafc; position: sticky; top: 0; }
  </style>
  </head>
  <body>
    <div class="login-wrap" id="login">
      <div class="login-card">
        <h2>Yönetici Girişi</h2>
        <p class="login-sub">Lütfen yetkili bilgilerinizle giriş yapın</p>
        <div class="field">
          <label for="username">Kullanıcı adı</label>
          <input id="username" placeholder="Kullanıcı adı" />
        </div>
        <div class="field">
          <label for="password">Şifre</label>
          <input id="password" type="password" placeholder="Şifre" />
        </div>
        <button id="loginBtn" class="btn">Giriş Yap</button>
        <div id="loginErr" class="err"></div>
      </div>
    </div>

    <div id="panel" class="panel">
      <div class="topbar">
        <h2>Çark Kayıtları</h2>
        <div class="actions">
          <button id="configBtn" class="settings">Ayarlar</button>
          <button id="refreshBtn" class="refresh">Yenile</button>
          <button id="deleteBtn" class="danger">Sil</button>
          <button id="logoutBtn" class="logout">Çıkış</button>
        </div>
      </div>
      <div class="content">
        <div id="panelErr" class="alert"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th><input type="checkbox" id="selectAll" /></th>
                <th>Ad</th>
                <th>Soyad</th>
                <th>E-posta</th>
                <th>Sonuç</th>
                <th>Onay</th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
  </html>
