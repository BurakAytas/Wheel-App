<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Çark Uygulaması - Kayıt</title>
  <script defer src="/register.js"></script>
  <style>
    :root { --overlay-bg: rgba(0,0,0,0.55); }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background: #0b1020;
    }
    /* full-screen wheel background (embed wheel.html) */
    .bg { position: fixed; inset: 0; overflow: hidden; }
    .bg iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; pointer-events: none; }
    /* overlay popup */
    .overlay { position: fixed; inset: 0; background: var(--overlay-bg); display: grid; place-items: center; padding: 20px; }
    .card {
      background: #ffffff;
      padding: 24px;
      border-radius: 14px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.35);
    }
    h1 { margin: 0 0 16px; font-size: 22px; }
    .field { margin-bottom: 12px; }
    label { display: block; font-size: 13px; color: #333; margin-bottom: 6px; }
    input {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #d0d5dd;
      border-radius: 8px;
      font-size: 14px;
    }
    .error { color: #b42318; font-size: 13px; min-height: 18px; }
    button {
      width: 100%;
      padding: 12px;
      background: #1f6feb;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      opacity: 0.8;
    }
    button.enabled { opacity: 1; }
  </style>
  </head>
  <body>
    <div class="bg">
      <iframe id="bgFrame" src="/wheel.html" title="Çark Arkaplan"></iframe>
    </div>
    <div class="overlay">
      <div class="card">
        <h1>Lukssay Çark Hoşgeldiniz</h1>
        <div class="field">
          <label>Ad</label>
          <input id="firstName" type="text" placeholder="Adınız" />
        </div>
        <div class="field">
          <label>Soyad</label>
          <input id="lastName" type="text" placeholder="Soyadınız" />
        </div>
        <div class="field">
          <label>E-posta</label>
          <input id="email" type="email" placeholder="ornek@mail.com" />
        </div>
        <div id="error" class="error"></div>
        <button id="continueBtn" disabled>Devam Et</button>
      </div>
    </div>
  </body>
  </html>
